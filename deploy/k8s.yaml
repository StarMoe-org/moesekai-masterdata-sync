# moesekai-masterdata-sync 部署参考（设计文档 §9）。只在集群内网提供，不建 Ingress。
# 只用于首次创建：kubectl create -f，不要 apply（见 deploy/README.md）。之后镜像标签由 CI 通知 Ferry 更新，
# 配置在 Zeabur 面板里改，以集群里的现状为准，不再把这个文件应用到集群。
# 标签和命名按 Zeabur 面板的约定（app.kubernetes.io/name、<服务名>-env、端口名 http）。
# Secret moesekai-masterdata-sync-env 需事先创建（不要提交真实值），见 deploy/README.md。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moesekai-masterdata-sync
  namespace: apps
  labels: { app.kubernetes.io/name: moesekai-masterdata-sync }
---
# jp 账号（设计文档 S6）：服务自动注册后写回这里。先建一个空的，Role 只允许读写这一个对象。
apiVersion: v1
kind: Secret
metadata:
  name: moesekai-masterdata-sync-accounts
  namespace: apps
  labels: { app.kubernetes.io/name: moesekai-masterdata-sync }
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: moesekai-masterdata-sync-accounts
  namespace: apps
  labels: { app.kubernetes.io/name: moesekai-masterdata-sync }
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [moesekai-masterdata-sync-accounts]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: moesekai-masterdata-sync-accounts
  namespace: apps
  labels: { app.kubernetes.io/name: moesekai-masterdata-sync }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: moesekai-masterdata-sync-accounts
subjects:
  - kind: ServiceAccount
    name: moesekai-masterdata-sync
    namespace: apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moesekai-masterdata-sync
  namespace: apps
  labels: { app.kubernetes.io/name: moesekai-masterdata-sync }
spec:
  replicas: 1                      # 两个副本会重复推送、重复注册账号：只能单副本
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: moesekai-masterdata-sync }
  template:
    metadata:
      labels: { app.kubernetes.io/name: moesekai-masterdata-sync }
    spec:
      serviceAccountName: moesekai-masterdata-sync
      automountServiceAccountToken: true    # 要读写账号 Secret（权限只到那一个对象）
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: moesekai-masterdata-sync
          image: ghcr.io/starmoe-org/moesekai-masterdata-sync:<12 位 commit sha>   # 用固定的 sha 标签，不用 latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef: { name: moesekai-masterdata-sync-env }
          env:
            - name: MOESEKAI_REGIONS
              value: jp,cn,en
            - name: GOMEMLIMIT          # cn 全量还原时 RSS 峰值约 1.3GB
              value: 1600MiB
          resources:
            requests: { cpu: 100m, memory: 512Mi, ephemeral-storage: 512Mi }
            limits:   { cpu: "1",  memory: 2Gi,   ephemeral-storage: 2Gi }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: work
          emptyDir: { sizeLimit: 1536Mi }   # 各区服数据仓库的本地副本（只有目录树和本服务写的对象，超过 512MB 自动清空）
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: moesekai-masterdata-sync
  namespace: apps
  labels: { app.kubernetes.io/name: moesekai-masterdata-sync }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: moesekai-masterdata-sync }
  ports:
    - name: http
      port: 8080
      targetPort: http
